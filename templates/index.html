<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkPlease - Instagram Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 3rem;
            font-weight: 700;
            color: #333;
        }

        .stat-card.sent .value { color: #10b981; }
        .stat-card.failed .value { color: #ef4444; }
        .stat-card.queued .value { color: #f59e0b; }
        .stat-card.duplicates .value { color: #8b5cf6; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .rules-list {
            margin-top: 20px;
        }

        .rule-item {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rule-item .keyword {
            font-weight: 600;
            color: #667eea;
            background: #eef2ff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .rule-item .message {
            flex: 1;
            margin: 0 16px;
            color: #666;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rule-item .rule-id {
            font-size: 0.75rem;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-left: auto;
        }

        .refresh-btn:hover {
            background: #f0f4ff;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 LinkPlease</h1>
            <p>Instagram Comment Automation System</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card sent">
                <h3>Delivered</h3>
                <div class="value" id="sent">-</div>
            </div>
            <div class="stat-card failed">
                <h3>Failed</h3>
                <div class="value" id="failed">-</div>
            </div>
            <div class="stat-card queued">
                <h3>Queued</h3>
                <div class="value" id="queued">-</div>
            </div>
            <div class="stat-card duplicates">
                <h3>Duplicates Blocked</h3>
                <div class="value" id="duplicates">-</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="card">
                <h2>Create Rule</h2>
                <form id="ruleForm">
                    <div class="form-group">
                        <label for="keyword">Keyword</label>
                        <input type="text" id="keyword" placeholder="e.g., PRICE" required>
                    </div>
                    <div class="form-group">
                        <label for="message">DM Message</label>
                        <textarea id="message" placeholder="Enter the message to send when this keyword is found..." required></textarea>
                    </div>
                    <button type="submit" class="btn">Create Rule</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Active Rules</h2>
                    <button class="refresh-btn" onclick="loadRules()">Refresh</button>
                </div>
                <div id="rulesList" class="rules-list">
                    <div class="loading">Loading rules...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load stats
        async function loadStats() {
            try {
                const response = await fetch('/stats');
                const data = await response.json();
                
                document.getElementById('sent').textContent = data.sent;
                document.getElementById('failed').textContent = data.failed;
                document.getElementById('queued').textContent = data.queued;
                document.getElementById('duplicates').textContent = data.duplicates_blocked;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Load rules
        async function loadRules() {
            try {
                const response = await fetch('/rules-list');
                const rules = await response.json();
                
                const container = document.getElementById('rulesList');
                
                if (rules.length === 0) {
                    container.innerHTML = '<div class="empty-state">No rules created yet</div>';
                    return;
                }
                
                container.innerHTML = rules.map(rule => `
                    <div class="rule-item">
                        <span class="keyword">${escapeHtml(rule.keyword)}</span>
                        <span class="message">${escapeHtml(rule.dm_message)}</span>
                        <span class="rule-id">${rule.rule_id}</span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load rules:', error);
                document.getElementById('rulesList').innerHTML = '<div class="empty-state">Failed to load rules</div>';
            }
        }

        // Create rule
        document.getElementById('ruleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const keyword = document.getElementById('keyword').value;
            const message = document.getElementById('message').value;
            
            try {
                const response = await fetch('/rules', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        keyword: keyword,
                        dm_message: message
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('keyword').value = '';
                    document.getElementById('message').value = '';
                    loadRules();
                    loadStats();
                } else {
                    alert('Failed to create rule');
                }
            } catch (error) {
                console.error('Failed to create rule:', error);
                alert('Failed to create rule');
            }
        });

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial load
        loadStats();
        loadRules();

        // Refresh stats every 5 seconds
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
